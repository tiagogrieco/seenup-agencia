<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <defs>
    <linearGradient id="rose-sunrise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B5A0"/>
      <stop offset="50%" stop-color="#B08D7E"/>
      <stop offset="100%" stop-color="#8B6F60"/>
    </linearGradient>
  </defs>
  <!-- Disco -->
  <circle cx="60" cy="60" r="48" fill="url(#rose-sunrise)"/>
  <!-- S serifa italica -->
  <text x="60" y="82" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="62" font-weight="400"
        text-anchor="middle" fill="#FAF8F5">S</text>
  <!-- Wordmark Seenup (italic serif) -->
  <text x="128" y="66" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="40" font-weight="400" fill="#2D2A26" letter-spacing="-1">Seenup</text>
  <!-- DIGITAL (sans, caixa alta, espaçada) -->
  <text x="269" y="66" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="500" fill="#5C5249" letter-spacing="4">DIGITAL</text>
</svg>
